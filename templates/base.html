<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <span class="logo">🎓 Face Attendance</span>
    {% if session.admin %}
      <div class="nav-links">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('register_page') }}">Register Student</a>

  <main class="container">

</html>
